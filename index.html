<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>1位 ポメラニアン</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff3dc;

    overflow:hidden;
}

/* =========================
   1280×720
========================= */

.stage{
    position:relative;

    width:1280px;
    height:720px;

    overflow:hidden;

    border-radius:30px;

    background:
    linear-gradient(
        180deg,
        rgba(255,235,180,0.14),
        rgba(255,215,120,0.06)
    ),
    url('haikei.png')
    center center / cover no-repeat;

    box-shadow:
    0 30px 80px rgba(0,0,0,0.22);
}

/* 背景キラ */

.stage::before{
    content:'';

    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at top,
        rgba(255,255,255,0.42),
        transparent 55%
    );

    z-index:0;
}

/* =========================
   ロゴ
========================= */

.event-logo{
    position:absolute;

    top:18px;
    right:18px;

    width:330px;

    z-index:10;

    filter:
    drop-shadow(0 10px 24px rgba(0,0,0,0.18));

    animation:
    fadeUp 1s ease;
}

/* =========================
   王冠
========================= */

.crown{
    position:absolute;

    top:95px;
    left:50%;

    transform:translateX(-50%);

    font-size:110px;

    filter:
    drop-shadow(0 0 18px rgba(255,220,120,0.8));

    z-index:8;

    animation:
    crownFloat 3s ease-in-out infinite;
}

/* =========================
   真ん中
========================= */

.center{
    position:absolute;

    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:5;

    transform:translateY(-45px);
}

/* 順位 */

.rank{
    font-family:'Panda';

    font-size:96px;

    line-height:1;

    color:#ffd44d;

    text-shadow:
    0 5px 0 #fff,
    0 0 24px rgba(255,220,100,0.85),
    0 10px 28px rgba(255,200,80,0.45);

    animation:
    glow 2.5s infinite alternate;
}

/* 犬種 */

.name{
    margin-top:12px;

    font-family:'Panda';

    font-size:145px;

    line-height:1;

    color:#ffffff;

    letter-spacing:4px;

    text-shadow:
    0 0 10px rgba(255,255,255,0.95),
    0 0 28px rgba(255,220,120,0.8),
    0 12px 30px rgba(0,0,0,0.18);

    animation:
    fadeUp 1.2s ease;
}

/* =========================
   写真
========================= */

.photo{
    position:absolute;

    width:350px;
    height:440px;

    object-fit:cover;

    background:
    linear-gradient(
        180deg,
        #fffdf6,
        #fff3cf
    );

    padding:12px 12px 55px;

    border-radius:18px;

    border:5px solid #ffe08a;

    box-shadow:
    0 24px 55px rgba(255,190,60,0.28);

    z-index:3;
}

/* 左 */

.left{
    left:35px;
    top:145px;

    transform:
    rotate(-6deg);

    animation:
    floatLeft 4s ease-in-out infinite;
}

/* 右 */

.right{
    right:35px;
    top:145px;

    transform:
    rotate(6deg);

    animation:
    floatRight 4s ease-in-out infinite;

    animation-delay:2s;
}

/* テープ */

.tape{
    position:absolute;

    width:115px;
    height:30px;

    background:
    repeating-linear-gradient(
        45deg,
        #ffe08a,
        #ffe08a 8px,
        #fff4c9 8px,
        #fff4c9 16px
    );

    opacity:0.96;

    border-radius:6px;

    box-shadow:
    0 4px 10px rgba(0,0,0,0.08);

    z-index:6;
}

.tape-left{
    left:145px;
    top:160px;

    transform:
    rotate(-8deg);
}

.tape-right{
    right:145px;
    top:160px;

    transform:
    rotate(8deg);
}

/* =========================
   投票数
========================= */

.vote-box{
    position:absolute;

    left:50%;
    bottom:82px;

    transform:
    translateX(-50%)
    scale(1);

    display:flex;
    align-items:center;
    gap:18px;

    padding:
    22px 44px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,245,0.98),
        rgba(255,240,200,0.96)
    );

    border:
    6px solid #ffd76c;

    border-radius:34px;

    box-shadow:
    0 18px 45px rgba(255,190,60,0.3),
    0 0 40px rgba(255,230,120,0.45);

    z-index:8;
}

/* 投票数 */

.vote-text{
    font-family:'Panda';

    font-size:44px;

    color:#9a6a20;
}

/* 数字 */

.vote-number{
    font-family:'Panda';

    font-size:98px;

    line-height:1;

    color:#ffffff;

    -webkit-text-stroke:3px #ffcf47;

    text-shadow:
    0 0 18px rgba(255,255,255,0.95),
    0 0 40px rgba(255,220,100,0.9);
}

/* 票 */

.vote-unit{
    font-family:'Panda';

    font-size:60px;

    color:#9a6a20;
}

/* =========================
   キラキラ
========================= */

.sparkle{
    position:absolute;

    z-index:1;

    opacity:0.95;

    animation:
    sparkle 3s infinite ease-in-out;
}

/* 星 */

.star{
    width:26px;
    height:26px;

    background:#fff5b0;

    clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
    );

    box-shadow:
    0 0 22px rgba(255,230,120,0.95);
}

/* ダイヤ */

.diamond{
    width:22px;
    height:22px;

    background:#fff0a8;

    transform:rotate(45deg);

    box-shadow:
    0 0 20px rgba(255,225,100,0.95);
}

/* 配置 */

.s1{
    top:70px;
    left:90px;
}

.s2{
    top:140px;
    left:320px;

    animation-delay:1s;
}

.s3{
    top:100px;
    right:330px;

    animation-delay:2s;
}

.s4{
    bottom:100px;
    left:210px;

    animation-delay:1.5s;
}

.s5{
    bottom:120px;
    right:230px;

    animation-delay:2.5s;
}

.s6{
    top:320px;
    left:520px;

    animation-delay:0.7s;
}

.s7{
    top:320px;
    right:520px;

    animation-delay:1.8s;
}

/* =========================
   アニメーション
========================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:
        translateY(24px);
    }

    to{
        opacity:1;
        transform:
        translateY(0);
    }
}

@keyframes sparkle{
    0%{
        transform:
        scale(0.7);

        opacity:0.35;
    }

    50%{
        transform:
        scale(1.4);

        opacity:1;
    }

    100%{
        transform:
        scale(0.7);

        opacity:0.35;
    }
}

@keyframes glow{
    from{
        text-shadow:
        0 0 12px rgba(255,220,100,0.7),
        0 10px 20px rgba(255,200,80,0.25);
    }

    to{
        text-shadow:
        0 0 28px rgba(255,255,255,1),
        0 0 45px rgba(255,220,100,0.95),
        0 12px 28px rgba(255,200,80,0.45);
    }
}

@keyframes crownFloat{
    0%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

    50%{
        transform:
        translateX(-50%)
        translateY(-10px);
    }

    100%{
        transform:
        translateX(-50%)
        translateY(0px);
    }
}

@keyframes floatLeft{
    0%{
        transform:
        rotate(-6deg)
        translateY(0px);
    }

    50%{
        transform:
        rotate(-6deg)
        translateY(-12px);
    }

    100%{
        transform:
        rotate(-6deg)
        translateY(0px);
    }
}

@keyframes floatRight{
    0%{
        transform:
        rotate(6deg)
        translateY(0px);
    }

    50%{
        transform:
        rotate(6deg)
        translateY(-12px);
    }

    100%{
        transform:
        rotate(6deg)
        translateY(0px);
    }
}

</style>
</head>

<body>

<div class="stage">

<!-- 王冠 -->

<div class="crown">
👑
</div>

<!-- キラキラ -->

<div class="sparkle star s1"></div>
<div class="sparkle diamond s2"></div>
<div class="sparkle star s3"></div>

<div class="sparkle diamond s4"></div>
<div class="sparkle star s5"></div>
<div class="sparkle diamond s6"></div>
<div class="sparkle star s7"></div>

<!-- ロゴ -->

<img
src="wan_logo.png"
class="event-logo"
>

<!-- テープ -->

<div class="tape tape-left"></div>
<div class="tape tape-right"></div>

<!-- 写真 -->

<img
src="pome1.png"
class="photo left"
>

<img
src="pome2.png"
class="photo right"
>

<!-- 真ん中 -->

<div class="center">

<div class="rank">
1位
</div>

<div class="name">
ポメラニアン
</div>

</div>

<!-- 投票数 -->

<div class="vote-box">

<div class="vote-text">
投票数
</div>

<div class="vote-number">
4673
</div>

<div class="vote-unit">
票
</div>

</div>

</div>

</body>
</html>
